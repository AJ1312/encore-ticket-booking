services:
  - type: web
    name: encore-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @encore/api build
    startCommand: pnpm --filter @encore/api db:migrate && pnpm --filter @encore/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
