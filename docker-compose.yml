services:
  postgres:
    image: postgres:16-alpine
    container_name: encore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encore
    ports:
      - "5432:5432"
    volumes:
      - encore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encore"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  encore_pgdata:
