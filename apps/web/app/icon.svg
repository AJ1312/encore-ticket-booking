<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1715" />
      <stop offset="50%" stop-color="#121416" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f4a261" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3d2d24" stop-opacity="0.3" />
    </linearGradient>

    <!-- Text / Serif E Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e07a5f" />
    </linearGradient>

    <!-- Coral Dot Glow -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e07a5f" stop-opacity="1" />
      <stop offset="70%" stop-color="#e07a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e07a5f" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Subtle Ticket Notch Detail -->
  <circle cx="0" cy="256" r="28" fill="#000000" opacity="0.3" />
  <circle cx="512" cy="256" r="28" fill="#000000" opacity="0.3" />

  <!-- Serif 'E' Monogram -->
  <text
    x="210"
    y="360"
    font-family="'Playfair Display', 'Georgia', 'Cinzel', serif"
    font-size="340"
    font-weight="700"
    font-style="italic"
    text-anchor="middle"
    fill="url(#letterGrad)"
    filter="url(#subtleGlow)"
  >
    E
  </text>

  <!-- Glowing Serif Brand Period / Dot -->
  <circle cx="366" cy="342" r="32" fill="url(#dotGlow)" />
  <circle cx="366" cy="342" r="18" fill="#e07a5f" />
</svg>
