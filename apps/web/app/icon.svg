<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E5E" />
      <stop offset="50%" stop-color="#E85D04" />
      <stop offset="100%" stop-color="#D00000" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E85D04" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Ticket shape tilted -->
  <g transform="translate(50, 50) rotate(-15) translate(-50, -50)" filter="url(#drop-shadow)">
    <!-- Main ticket body -->
    <path d="M 25 35 L 75 35 C 77.761 35 80 37.239 80 40 L 80 45 C 77.239 45 75 47.239 75 50 C 75 52.761 77.239 55 80 55 L 80 60 C 80 62.761 77.761 65 75 65 L 25 65 C 22.239 65 20 62.761 20 60 L 20 55 C 22.761 55 25 52.761 25 50 C 25 47.239 22.761 45 20 45 L 20 40 C 20 37.239 22.239 35 25 35 Z" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Ticket perforation line -->
    <line x1="35" y1="37" x2="35" y2="63" stroke="url(#glow)" stroke-width="2" stroke-dasharray="3,3" />
  </g>
  
  <!-- The 'E' -->
  <text x="52" y="65" font-family="Georgia, serif" font-size="48" font-weight="bold" font-style="italic" fill="url(#glow)" text-anchor="middle" filter="url(#drop-shadow)">E</text>
</svg>
