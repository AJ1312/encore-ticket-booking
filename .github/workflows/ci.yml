name: encore-ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore_password
          POSTGRES_DB: encore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @encore/api db:migrate
        env:
          DATABASE_URL: postgresql://encore:encore_password@localhost:5432/encore
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://encore:encore_password@localhost:5432/encore
      - run: pnpm audit --audit-level high
